name: docker-buildx
on:
  pull_request:
    branches:
      - main
      - experimental
  push:
    branches:
      - '**'
    tags:
      - '*.*'
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
    steps:
    - uses: getong/mariadb-action@d6d2ec41fd5588f369be4c9398ce77ee725ca9ea # v1.11
      with:
        mysql database: 'pigallery_test'
        mysql root password: 'password'
        mysql user: 'user'
        mysql password: 'password'
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Verify MariaDB connection
      env:
        PORT: ${{ job.services.mariadb.ports[3306] }}
      run: |
        while ! mysqladmin ping -h"127.0.0.1" -P"$PORT" --silent; do
          sleep 1
        done

    - name: npm install and build
      run: |
        npm ci --include=optional
        npm run build

    - name: lint
      run: |
        npm run lint
    - name: frontend tests
      timeout-minutes: 10
      run: |
        npm run test-frontend
      env:
        CI: true
    - name: backend tests
      timeout-minutes: 10
      run: |
        npm run test-backend
        npm run coverage
      env:
        MYSQL_HOST: localhost
        MYSQL_USERNAME: root
        MYSQL_PASSWORD: password
        MYSQL_PORT: ${{ job.services.mariadb.ports[3306] }}
        TEST_MYSQL: true
        PORT: 35000
        CI: true
    - name: Coveralls
      continue-on-error: true
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
    - name: E2E test - Cypress run
      uses: cypress-io/github-action@fa4a118725a8f001170d49631ea89e5d66fee626 # v7
      env:
        DEBUG: '@cypress/github-action'
      with:
        start: npm run start-e2e-server
      # after the test run completes store screenshots
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: failure() # Store screenshots only on failures
      with:
         name: cypress-screenshots
         path: test/cypress/screenshots
         if-no-files-found: ignore # 'warn' or 'error' are also available, defaults to `warn`

  create-release:
    runs-on: [ubuntu-latest]
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      -
        name: Setup Node.js for use with actions
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      -
        name: Install Deps
        run: npm install --unsafe-perm
      -
        name: Create Release
        run: npm run create-release -- --skip-opt-packages=ffmpeg-static,ffprobe-static --force-opt-packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pigallery2-release
          path: release

  # --- MULTI-PLATFORM DOCKER VERIFICATION ---
  build-verify-docker:
    runs-on: ubuntu-latest
    needs: [test, create-release]
    strategy:
      fail-fast: false # Ensures one platform failure doesn't stop others from testing
      matrix:
        container: [alpine, debian-trixie]
        include:
          - container: alpine
            platforms: linux/amd64
          - container: debian-trixie
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download Release Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pigallery2-release
          path: pigallery2-release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and Verify Platforms
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/${{ matrix.container }}/Dockerfile.build
          platforms: ${{ matrix.platforms }}
          push: false # Do not push yet
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- FIXABLE HIGH/CRITICAL VULNERABILITY GATE ---
  scan-docker:
    runs-on: ubuntu-latest
    needs: [build-verify-docker, create-release]
    strategy:
      fail-fast: false
      matrix:
        container: [alpine, debian-trixie]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download Release Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pigallery2-release
          path: pigallery2-release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for vulnerability scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/${{ matrix.container }}/Dockerfile.build
          platforms: linux/amd64
          load: true
          tags: pigallery2plus:scan-${{ matrix.container }}
          cache-from: type=gha

      - name: Scan image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pigallery2plus:scan-${{ matrix.container }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  # --- DOCKER LOGIN AND PUSH ---
  push-docker:
    runs-on: ubuntu-latest
    needs: [build-verify-docker, scan-docker]
    # Only push on branch merges or tags, never on plain PRs
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/experimental'
    strategy:
      matrix:
        container: [alpine, debian-trixie]
        include:
          - container: alpine
            platforms: linux/amd64
          - container: debian-trixie
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download Release Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pigallery2-release
          path: pigallery2-release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Verified Images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/${{ matrix.container }}/Dockerfile.build
          platforms: ${{ matrix.platforms }}
          push: true
          cache-from: type=gha # Pulls from the cache created in Job 1
          tags: |
            ${{ (github.ref == 'refs/heads/main' && matrix.container == 'debian-trixie') && format('{0}/pigallery2plus:edge,{0}/pigallery2plus:edge-{1}', secrets.REGISTRY_NAMESPACE, matrix.container) || '' }}
            ${{ (github.ref == 'refs/heads/main' && matrix.container != 'debian-trixie') && format('{0}/pigallery2plus:edge-{1}', secrets.REGISTRY_NAMESPACE, matrix.container) || '' }}
            ${{ (github.ref == 'refs/heads/experimental') && format('{0}/pigallery2plus:experimental-{1}', secrets.REGISTRY_NAMESPACE, matrix.container) || '' }}
            ${{ (startsWith(github.ref, 'refs/tags/') && matrix.container == 'debian-trixie') && format('{0}/pigallery2plus:{1},{0}/pigallery2plus:latest,{0}/pigallery2plus:edge-{2}', secrets.REGISTRY_NAMESPACE, github.ref_name, matrix.container) || '' }}
            ${{ (startsWith(github.ref, 'refs/tags/') && matrix.container != 'debian-trixie') && format('{0}/pigallery2plus:{1}-{2},{0}/pigallery2plus:latest-{2},{0}/pigallery2plus:edge-{2}', secrets.REGISTRY_NAMESPACE, github.ref_name, matrix.container) || '' }}
